# Tuned for a one-maintainer repository: one grouped pull request a month per
# ecosystem, instead of one per package per week.
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: 'monthly'
    # Wait 5 days before updating to help circumvent supply chain attacks
    cooldown:
      default-days: 5
      # Exclude plugin-e2e to prevent false positives with canary e2e tests
      exclude:
        - '@grafana/plugin-e2e'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore'
      include: 'scope'
    ignore:
      # The Grafana libraries are the API the plugin is built against. They stay
      # at the oldest Grafana the plugin supports (plugin.json grafanaDependency)
      # and move deliberately, together with that version.
      - dependency-name: '@grafana/data'
      - dependency-name: '@grafana/i18n'
      - dependency-name: '@grafana/runtime'
      - dependency-name: '@grafana/schema'
      - dependency-name: '@grafana/ui'
      # Major versions of the build and lint tooling arrive through Grafana's
      # scaffold updates (npx @grafana/create-plugin@latest update), which
      # change the configs that go with them.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      dev-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
      runtime-dependencies:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    commit-message:
      prefix: 'chore(ci)'
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - '*'
