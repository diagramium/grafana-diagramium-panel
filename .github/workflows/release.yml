# Builds the plugin zip and publishes it as a GitHub release.
#
# Runs when a version tag (v1.2.3) is pushed, or by hand from the Actions tab
# ("Run workflow") for a tag that already exists. The plugin is distributed
# unsigned from GitHub, so Grafana's catalog validator runs as a report only:
# its Grafana Cloud account check is a catalog requirement, not a release one.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'A tag that already exists, e.g. v0.1.1 (to release a new version, push its tag instead)'
        required: true

permissions: read-all

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check the tag exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --silent 2>/dev/null; then
            echo "::error::Tag ${TAG} does not exist. To release a new version, bump package.json, merge, then push the tag (git tag v1.2.3 && git push origin v1.2.3); the release then runs by itself. Run workflow only rebuilds a release for a tag that already exists."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Check
        run: |
          npm run typecheck
          npm run lint
          npm run test:ci

      - name: Build
        run: npm run build

      - name: Check the version matches the tag
        run: |
          VERSION=$(jq -r .info.version dist/plugin.json)
          if [ "v${VERSION}" != "${TAG}" ]; then
            echo "::error::plugin version ${VERSION} does not match tag ${TAG}"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Package
        run: |
          ID=$(jq -r .id dist/plugin.json)
          ARCHIVE="${ID}-${VERSION}.zip"
          mv dist "${ID}"
          zip -qr "${ARCHIVE}" "${ID}"
          sha1sum "${ARCHIVE}" | cut -d' ' -f1 > "${ARCHIVE}.sha1"
          # The same file under a fixed name, so the latest release always
          # downloads from .../releases/latest/download/<id>.zip.
          cp "${ARCHIVE}" "${ID}.zip"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"
          echo "LATEST_ARCHIVE=${ID}.zip" >> "$GITHUB_ENV"

      - name: Grafana plugin validator (report only)
        continue-on-error: true
        run: npx -y @grafana/plugin-validator@latest -sourceCodeUri file://./ "${ARCHIVE}"

      - name: Release notes from the changelog
        run: |
          awk -v v="${VERSION}" '
            /^## / { if (found) exit; if (index($0, "## " v) == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'NOTES'

          ### Install

          ```bash
          grafana cli --pluginUrl https://github.com/diagramium/grafana-diagramium-panel/releases/latest/download/diagramium-diagram-panel.zip plugins install diagramium-diagram-panel
          ```

          or unzip the attached archive into your Grafana plugins folder. Then allow the unsigned plugin and restart Grafana:

          ```ini
          [plugins]
          allow_loading_unsigned_plugins = diagramium-diagram-panel
          ```

          Documentation: https://github.com/diagramium/grafana-diagramium-panel#readme
          NOTES

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${TAG}" "${ARCHIVE}" "${ARCHIVE}.sha1" "${LATEST_ARCHIVE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TAG}" \
            --notes-file notes.md \
            --verify-tag
